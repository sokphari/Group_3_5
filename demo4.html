  <style>
    body {
  background: linear-gradient(135deg, #eef2ff, #f8fafc);
  min-height: 100vh;
  font-family: Arial, sans-serif;
}

.province-card {
  background: #ffffff;
  border-radius: 24px;
  overflow: hidden;
  border: 1px solid rgba(226, 232, 240, 0.9);
  box-shadow: 0 15px 35px rgba(15, 23, 42, 0.08);
  transition: all 0.35s ease;
}

.province-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 25px 55px rgba(15, 23, 42, 0.16);
}

.province-image-box {
  height: 220px;
  overflow: hidden;
  background: #e5e7eb;
}

.province-image-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: all 0.45s ease;
}

.province-card:hover .province-image-box img {
  transform: scale(1.08);
}

.province-content {
  padding: 24px;
}

.province-content h4 {
  font-size: 22px;
  font-weight: 800;
  color: #111827;
  margin-bottom: 6px;
}

.district-count {
  font-size: 14px;
  font-weight: 600;
  color: #6366f1;
  margin-bottom: 16px;
}

.district-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.district-badge {
  background: #eef2ff;
  color: #3730a3;
  font-size: 13px;
  font-weight: 600;
  padding: 7px 12px;
  border-radius: 999px;
}
  </style>
</head>

</body>
