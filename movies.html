<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MovieZone</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #667eea, #5b85df);
    }

    /* Navbar */
    .navbar {
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    /* Movie Card */
    .card {
      border-radius: 15px;
      overflow: hidden;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-8px);
    }

    .card img {
      height: 250px;
      object-fit: cover;
    }

    .stars {
      color: gold;
    }

    /* Contact */
    .contact-card {
      max-width: 500px;
      margin: auto;
      padding: 25px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      color: white;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .btn-custom {
      background: white;
      color: #764ba2;
      font-weight: bold;
      border-radius: 10px;
    }

    .btn-custom:hover {
      transform: scale(1.05);
    }
  </style>
</head>
