<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSE7J2Gu45X36EdD_gVLdaHCif5qiPVnGCSDQ&s");
      background-repeat: no-repeat;
      background-size: cover;

    /* main box */
    .login-box {
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(13, 110, 253, 0.3);
    }

    /* left image */
    .left-side {
      background: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQITlfKnkFUN7KS7g0LneUYGjk6Bk5iVKIQow&s");
      border-top-right-radius: 80px;
      border-bottom-right-radius: 80px;
    }

    /* right login */
    .right-side {
      background: rgb(25,25,25,0.15)
      padding: 40px;
    }

    .login-title {
      color: #0d6efd;
      font-weight: bold;
    }

    .form-control {
      border-radius: 10px;
    }

    .btn-primary {
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="row justify-content-center align-items-center vh-100">

      <div class="col-md-8">
        <div class="row login-box">

          <!-- Left Image -->
          <div class="col-md-6 left-side"></div>

          <!-- Right Login -->
          <div class="col-md-6 right-side">

            <h3 class="text-center mb-4 login-title">Login</h3>

            <form>

              <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" placeholder="Enter username">
              </div>

              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Enter password">
              </div>

              <div class="d-grid mb-3">
                <button class="btn btn-primary">Login</button>
              </div>

              <div class="text-center">
                <a href="#" class="text-decoration-none">Forgot Password?</a>
              </div>

            </form>

          </div>

        </div>
      </div>

    </div>
  </div>

</body>

</html>
