<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promotions</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to bottom, #1a0000, #000);
      color: white;
      font-family: Arial, sans-serif;
    }

    .section-title {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .promo-card {
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      overflow: hidden;
      transition: 0.3s;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .promo-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .promo-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .promo-text {
      padding: 15px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="container py-5">
  <h1 class="section-title">Promotions</h1>

  <div class="row g-4">

    <!-- Card 1 -->
    <div class="col-md-4">
      <div class="promo-card">
        <img src="https://i.pinimg.com/736x/93/09/0f/93090f65a27924397b98cc1f44bc8b3d.jpg" alt="">
        <div class="promo-text">
          🎉 Special Promotion to Celebrate Khmer New Year! 🥳
        </div>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="col-md-4">
      <div class="promo-card">
        <img src="https://i.pinimg.com/736x/70/9e/c3/709ec3210374e26b9ace33c97fa4ca83.jpg" alt="">
        <div class="promo-text">
          🎤💜 Army Army! Join us for the Live Concert of BTS!
        </div>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="col-md-4">
      <div class="promo-card">
        <img src="https://i.pinimg.com/1200x/2e/0a/60/2e0a604645bb15f80131dffcb35d31f7.jpg" alt="">
        <div class="promo-text">
          🎉 Special Promotion for Khmer New Year!
        </div>
      </div>
    </div>

    <!-- Card 4 -->
    <div class="col-md-4">
      <div class="promo-card">
        <img src="https://i.pinimg.com/1200x/dd/0a/f2/dd0af2226a88e1f164c84e1bb624fc4a.jpg" alt="">
        <div class="promo-text">
          Premium Cheese Popcorn is here! 🧀🍿
        </div>
      </div>
    </div>

    <!-- Card 5 -->
    <div class="col-md-4">
      <div class="promo-card">
        <img src="https://i.pinimg.com/736x/2f/b0/12/2fb01219778394778239c247ff110c3d.jpg" alt="">
        <div class="promo-text">
          Let's enjoy the special price from Legend Toul Kork Cinema!
        </div>
      </div>
    </div>

    <!-- Card 6 -->
    <div class="col-md-4">
      <div class="promo-card">
        <img src="https://i.pinimg.com/736x/f0/97/18/f097186e7fd7b3bbdcbc67cdca75c78d.jpg" alt="">
        <div class="promo-text">
          New Update! ✨ Special Rates for Students!
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
